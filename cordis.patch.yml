# dsh-acp-enhanced bundle patch: inserts the enhanced ACP transport over a
# composition that provides ctx.agents (the agent spine), an LLM adapter,
# sandboxed bash/fs, approval, and optionally permission presets (for the
# session/mode and permission_preset config surfaces).
#
# Official install (auto-initializes the profile, auto-appends this package to
# the profile's bundle layers — no manual patch writing):
#   dsh plugin --profile <name> add "link:/absolute/path/to/dsh-acp-enhanced"
#
# The model route is driven by environment variables (set them in Zed's
# agent_servers env, or export before `dsh --profile <name>`):
#   DSH_ACP_PROVIDER  provider id, e.g. deepseek-official or your gateway id
#   DSH_ACP_MODEL     model id, e.g. deepseek-v4-flash
#   DSH_ACP_PRESET    agent preset id, e.g. minimal / standard / code / cordis
# Both route values default to the DeepSeek official route. Overriding
# `agent-default-model` keeps the bridge's per-session selection fallback on
# the same route (before any request header exists), so the first prompt never
# falls back to a non-routable default.
- id: agent-default-model
  config:
    provider: !!js "process.env.DSH_ACP_PROVIDER ?? 'deepseek-official'"
    model: !!js "process.env.DSH_ACP_MODEL ?? 'deepseek-v4-flash'"

# ── agent presets ───────────────────────────────────────────────────────────
#
# The model-facing plugin set moves INTO the dsh agent-presets roster: every
# session composes its tools/prompt sections from one preset directory
# (standard/code/minimal/cordis, plus user-authored presets in
# ~/.dsh/.agent-presets). The dsh CLI's profile-boot overlays the shipped
# `config/agent-presets/` root onto the `agent-presets` row automatically, and
# the roster itself appends the user root (`includeUserRoot` default).
#
# The bridge composes each session from this roster through
# `presets.mount()` (inside the agent factory's `setup`) and exposes the choice
# on the ACP wire as the `agent_preset` config option + `/preset` command.
#
# Every dsh-base model-facing row a preset owns on EVERY supported generation is
# disabled here, so a `minimal` (极简模式) agent does not leak host-layer tools —
# an agent's tool registry view resolves agent → preset → global. This mirrors
# the official dsh-web-app / dsh-tui patch (minus `hmr`, which is
# web-app-specific).
#
# `command-goal` is deliberately NOT in the list even though the current
# standard preset owns it and the web-app patch disables it. The shipped
# standard preset only started owning that row in 0.1.2-rc.1: on ≤ 0.1.1-rc.2 the
# base row is `/goal`'s ONLY provider, so disabling it here would delete the
# command on those hosts. A patch is static YAML and its `!!js` expressions are
# evaluated against the loader context plus globals only
# (`cordis-plugin-loader` `new Function('ctx','expr', 'with (ctx) …')`), which
# exposes no harness version — so the disable cannot be made generation-aware.
# Consequence, accepted: on ≥ 0.1.2 a `minimal`/`code` session still advertises
# `/goal` from the base layer. Do not "fix" this by adding the row; it would
# regress every ≤ 0.1.1-rc.2 host.
#
# The list must stay version-agnostic: it spans harness generations whose base
# row sets differ, and the patch applier only warns-and-skips an id it cannot
# find (`@deepseek-ai/dsh-app-boot` applyEntryPatches). So a row that only some
# generations ship (e.g. `workflow-ptc` on ≥ 0.1.6, `workflow-worker-thread` /
# `tool-str-replace-editor` on ≤ 0.1.2-rc.1) is listed unconditionally — the
# generations that lack it log a benign "entry not found" warning.
- id: agent-instructions
  disabled: true

- id: command-compact
  disabled: true

- id: compaction-basic
  disabled: true

- id: plan-mode
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-jobs
  disabled: true

# Added by dsh-base 0.1.6 (the plugin-manager's model-facing tool row); the
# shipped `standard` preset owns it, exactly like the other tools here.
- id: tool-plugin-manager
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- id: tool-workflow
  disabled: true

# dsh-base 0.1.6 replaced `workflow-worker-thread` with the PTC runtime and
# mounts the latter enabled; the shipped `standard` preset owns that row, so it
# is disabled here too (the row is absent on ≤ 0.1.2-rc.1 hosts, where the
# applier warns and skips).
- id: workflow-ptc
  disabled: true

- id: workflow-worker-thread
  disabled: true

- insert:
    # Host-owned opt-in the shipped `standard` preset samples when it mounts
    # tool-subagent with `modelSelectionSettings: true`. dsh-base carries no such
    # row, so an app bundle has to supply it — `@deepseek-ai/dsh-web-app` inserts
    # this exact row for the web profile. Without it every `session/new` on the
    # `standard` preset fails with `tool-subagent: modelSelectionSettings
    # requires @deepseek-ai/dsh-tool-subagent/model-selection-settings in the
    # Host scope`, so this row is part of a bootable ACP composition, not a
    # nicety.
    #
    # It has the canonical id, which means a profile's user layer must NOT also
    # seed it: `cordis-plugin-loader` rejects a repeated id outright
    # (`duplicate loader entry id: …`), aborting the whole plugin tree. Older
    # revisions of this repo handed the row to the user layer instead (the
    # module did not exist on ≤ 0.1.1 hosts); `scripts/init-acp-home.sh` removes
    # that legacy copy, and the doctor names it if one is left behind.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # ── the agent-preset roster: `ctx.agentPresets` ─────────────────────────
    #
    # The service the bridge composes every session's model-facing world from.
    # Its packaging was rewritten in 0.1.7, and BOTH shapes ship here so one
    # binary boots every supported line:
    #
    #   • ≤ 0.1.6 — `@deepseek-ai/dsh-agent-presets` bundles the shipped
    #     standard/ptc/minimal/cordis compositions and prepends them as a
    #     read-only `system` root; it also appends the user-authored
    #     `$DSH_HOME/.agent-presets` root. This single row IS the whole plane.
    #   • ≥ 0.1.7 — that package does not exist. Its replacement,
    #     `@deepseek-ai/dsh-agent-preset-registry`, carries no presets: every
    #     preset is a separate `@deepseek-ai/dsh-agent-preset` declaration row,
    #     which is the shape `@deepseek-ai/dsh-web-app` ships as its
    #     `presets/*.patch.yml` layers. The four declarations below are that
    #     bundle's set (MIT, 0.1.7-rc.2), with the display metadata the old
    #     roster's per-preset `preset.yml` carried added back: 0.1.7's registry
    #     publishes no `name` for a shipped id (its own surfaces localize the
    #     copy), while this bridge's ACP dropdown and `/preset` render
    #     `preset.name` themselves.
    #
    # Both roster rows provide the same service name, so exactly one may
    # activate; the `disabled` gate is the generation test. It cannot live in a
    # `name:` or `config:` value, because a `name:` that resolves to nothing is
    # a hard import failure — a disabled row is never imported.
    #
    # The gate reads the identity of the *installation that is booting*, from
    # `profileContext.installAnchor` (0.1.6+; absent on 0.1.5, which is itself
    # the `≤ 0.1.6` answer). That path is the CLI's own package.json, so its
    # `version` names the closure whose roster package the loader will import.
    # The registry roster starts at 0.1.7 on the 0.1.x line; anything below it —
    # and any unreadable or future version we cannot classify — keeps the older
    # shape.
    #
    # Why not ask the resolver (`ctx.pluginPackages.packageOf`) instead? That
    # was the first cut, and it is wrong for a `link:`-installed bridge: a
    # resolution probe runs from the profile, which reaches the *linked
    # checkout's* own tree, so a dev checkout carrying 0.1.7 packages made a
    # 0.1.6 host believe the registry was present. It disabled the working
    # roster row and then failed to import five 0.1.7 rows
    # (`agent-preset-registry: failed to import`). The installation anchor has
    # no such reach: it is a fixed path inside the running CLI, and reading it is
    # independent of the profile, the layout (npm flat or pnpm strict) and any
    # linked package.
    #
    # `!!js` expressions are evaluated `with (ctx)` over the loader context plus
    # globals, which is why the version has to be read rather than queried:
    # nothing in scope exposes it. `process.getBuiltinModule` keeps the `fs`
    # read in scope (Node ≥ 22.3; a host without it throws into the catch).
    #
    # `profileContext` is registered by the profile-boot `prepare` callback,
    # which runs before the plugin tree is mounted — the gate never races it.
    #
    # Fail-open direction: anything unreadable, unparseable or unexpected keeps
    # the `≤ 0.1.6` row enabled. On a 0.1.7 host that is the degradation this
    # bridge had before this release — sessions compose from the host layer and
    # the `agent_preset` option simply is not offered — never a boot failure.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      disabled: !!js >-
        (() => {
          try {
            const anchor = ctx.get('profileContext')?.installAnchor
            if (typeof anchor !== 'string') return false
            const manifest = JSON.parse(process.getBuiltinModule('node:fs').readFileSync(anchor, 'utf8'))
            const version = /^(\d+)\.(\d+)\.(\d+)/.exec(String(manifest?.version ?? ''))
            if (version === null) return false
            const [major, minor, patch] = version.slice(1).map(Number)
            return major > 0 || minor > 1 || (minor === 1 && patch >= 7)
          } catch {
            return false
          }
        })()
      config:
        default: !!js "process.env.DSH_ACP_PRESET ?? 'standard'"

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      disabled: &legacyLine !!js >-
        (() => {
          try {
            const anchor = ctx.get('profileContext')?.installAnchor
            if (typeof anchor !== 'string') return true
            const manifest = JSON.parse(process.getBuiltinModule('node:fs').readFileSync(anchor, 'utf8'))
            const version = /^(\d+)\.(\d+)\.(\d+)/.exec(String(manifest?.version ?? ''))
            if (version === null) return true
            const [major, minor, patch] = version.slice(1).map(Number)
            return !(major > 0 || minor > 1 || (minor === 1 && patch >= 7))
          } catch {
            return true
          }
        })()
      config:
        default: !!js "process.env.DSH_ACP_PRESET ?? 'standard'"

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: *legacyLine
      config:
        id: standard
        name: 标准模式
        description: 功能完整的编码 Agent，支持文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

