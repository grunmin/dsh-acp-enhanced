# acp-enhanced profile: an ACP automation server exposing the Web-GUI surfaces
# (block-level streaming, usage/stat telemetry, model & reasoning-effort
# switching, permission-preset modes) to ACP clients such as the Zed editor.
#
# Run with:
#   dsh --profile acp-enhanced
# then register it in Zed settings.json under agent_servers (see README.md).
#
# Stdout carries ONLY newline-delimited ACP JSON-RPC. No logger may write to
# stdout; diagnostics belong on stderr.

# ── the shared agent spine (llm, session, system-prompt, tools, skill,
#    agent registry + loop, goals, jobs) with NO pre-created agents ─────────
- id: spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    maxParallelToolCalls: 1
    workspaceContext:
      maxBytes: 65536
    persona: >-
      You are a coding assistant powered by the {{model}} model. Your working
      directory is {{cwd}}. Your bash tool runs under a file sandbox — a
      `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

# ── the DeepSeek adapter ────────────────────────────────────────────────────
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# ── sandbox stack: bash + filesystem share one workspace-write policy ───────
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# ── permission presets: the ACP mode/config surface for sandbox+approval ────
- id: permission-presets
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        name: Read-only
        description: Read-only sandbox; every write asks for approval.
        sandbox: read-only
        approval: ask
      workspace-write:
        name: Workspace write
        description: Write inside the workspace; wider retries require approval.
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        name: Full access
        description: Full file access without approval prompts.
        sandbox: danger-full-access
        approval: never

# ── durability: JSONL session log + checkpointing + derived query index ─────
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_ACP_SESSIONS_ROOT ?? './.sessions'

- id: session-checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js process.env.DSH_ACP_SESSIONS_ROOT ?? './.sessions'
    openAt: startup

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# ── telemetry & compaction ──────────────────────────────────────────────────
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# ── filesystem tools on the same sandbox policy ─────────────────────────────
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ── remaining model-facing tools ────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

# ── the enhanced ACP transport (stdout is the protocol wire) ────────────────
- id: acp-enhanced
  name: 'dsh-acp-enhanced'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
