name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # secrets is not available inside `if` conditions; route it through a
      # job-level env var instead so the full e2e step can gate on presence.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    strategy:
      matrix:
        node-version: [22, 24]
        # Both lines the peer range claims: the pin (0.1.5-rc.2) and the 0.1.6
        # alpha line. Every job below boots a real profile, so a green run is
        # boot-time verification of the support claim — the old matrix only
        # link-checked 0.1.6-alpha.2 through scripts/compat-check.mjs.
        # `.github/workflows/canary.yml` watches the line after these.
        dsh-version: ['0.1.5-rc.2', '0.1.6-alpha.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/codec.js && node --check scripts/acp-client.mjs && node --check scripts/acp-client-tools.mjs && node --check scripts/acp-doctor.mjs && node --check scripts/acp-launcher-test.mjs && node --check scripts/acp-message-fallback-test.mjs && node --check scripts/acp-mcp-test.mjs && node --check scripts/acp-resume-test.mjs && node --check scripts/acp-smoke-keyless.mjs && node --check scripts/compat-check.mjs && node --check scripts/api-surface-check.mjs && node --check scripts/codec-image-test.mjs && node --check scripts/replay-order-test.mjs && node --check scripts/terminal-codec-test.mjs && node --check scripts/lib/dsh-home.mjs && node --check scripts/lib/dsh-version.mjs && node --check scripts/fixtures/mcp-echo-server.mjs
      - name: Public-surface guard (declared harness API only)
        run: node scripts/api-surface-check.mjs
      - name: Launcher contract (no implicit home switch)
        run: node scripts/acp-launcher-test.mjs
      - name: Codec unit tests (offline, deterministic)
        run: |
          node scripts/replay-order-test.mjs
          node scripts/codec-image-test.mjs
          node scripts/terminal-codec-test.mjs
      - name: Package integrity (tarball contents)
        run: npm pack --dry-run
      - name: Install dsh CLI (${{ matrix.dsh-version }})
        run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh-version }}
      - name: Keyless boot smoke (initialize + session/new)
        run: node scripts/acp-smoke-keyless.mjs
      - name: MCP mount smoke (no model calls)
        run: node scripts/acp-mcp-test.mjs
      - name: Full e2e (requires DEEPSEEK_API_KEY)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: node scripts/acp-client.mjs
      - name: assistant/message fallback e2e (requires DEEPSEEK_API_KEY)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: node scripts/acp-message-fallback-test.mjs
